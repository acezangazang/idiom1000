    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            margin: 20px;
            background-color: Canvas;
            color: CanvasText;
        }

        h2 {
            margin-top: 0;
        }

        .player-section {
            display: flex;
            gap: 20px;
            background: Canvas;
            color: CanvasText;
            padding: 20px;
            border: 1px solid GrayText;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.12);
            margin-bottom: 20px;
            align-items: flex-start;
        }

        #main-player {
            flex: 0 0 auto;
            width: 640px;
            max-width: 100%;
            aspect-ratio: 16 / 9;
        }

        .side-panel {
            flex: 1;
            min-width: 260px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-section {
            width: 100%;
        }

        .search-bar {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            font-size: 16px;
            color: FieldText;
            background-color: Field;
            border: 2px solid Highlight;
            border-radius: 20px;
            outline: none;
        }

        .search-bar:focus {
            box-shadow: 0 0 0 3px color-mix(in srgb, Highlight 25%, transparent);
        }

        .sort-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .sort-buttons button {
            padding: 8px 14px;
            border: 1px solid GrayText;
            border-radius: 20px;
            background: ButtonFace;
            color: ButtonText;
            cursor: pointer;
        }

        .sort-buttons button:hover {
            filter: brightness(0.95);
        }

        .current-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #current-playing-title {
            margin: 0;
            font-size: 18px;
            line-height: 1.4;
        }

        .auto-play-note {
            margin: 0;
            color: CanvasText;
            font-weight: bold;
            opacity: 0.8;
        }

        .next-button {
            align-self: flex-start;
            padding: 8px 15px;
            background: Highlight;
            color: HighlightText;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        .next-button:hover {
            filter: brightness(0.95);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(5, minmax(0, 1fr));
            gap: 15px;
        }

        .video-item {
            background: Canvas;
            color: CanvasText;
            border: 1px solid GrayText;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .video-item:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: Canvas;
        }

        .thumbnail-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-title {
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.4;
            color: CanvasText;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }


        .load-more-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 24px 0 10px;
        }

        .result-count {
            font-size: 14px;
            color: CanvasText;
            opacity: 0.75;
        }

        .load-more-button {
            padding: 10px 24px;
            background: Highlight;
            color: HighlightText;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .load-more-button:hover {
            filter: brightness(0.95);
        }

        .load-more-button[hidden] {
            display: none;
        }

        @media (max-width: 980px) {
            .player-section {
                flex-direction: column;
            }

            #main-player {
                width: 100%;
            }

            .side-panel {
                width: 100%;
            }

            .video-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            body {
                margin: 12px;
            }

            .player-section {
                padding: 12px;
            }

            .video-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }
        }
    </style>
</head>

        const PAGE_SIZE = 100;

        let sortMode = 'latest';
        let filteredList = [...videoList].reverse();
        let currentTrackIndex = 0;
        let visibleCount = PAGE_SIZE;
        let player;

        // API 로드
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            if (filteredList.length === 0) return;

            const lastVideoId = localStorage.getItem('lastVideoId');
            const lastVideo = videoList.find(v => v.id === lastVideoId);
            const defaultVideo = lastVideo || filteredList[0];

            currentTrackIndex = filteredList.findIndex(v => v.id === defaultVideo.id);
            if (currentTrackIndex < 0) currentTrackIndex = 0;

            player = new YT.Player('main-player', {
                height: '360',
                width: '640',
                videoId: defaultVideo.id,
                playerVars: {
                    autoplay: 0,
                    rel: 0,
                    origin: window.location.origin
                },
                events: {
                    onStateChange: onPlayerStateChange,
                    onReady: onPlayerReady
                }
            });
        }

        function onPlayerReady() {
            if (filteredList[currentTrackIndex]) {
                document.getElementById('current-playing-title').innerText =
                    filteredList[currentTrackIndex].title;
            }
        }

        function renderVideoGrid(list) {
            const grid = document.getElementById('videoGrid');
            const loadMoreButton = document.getElementById('loadMoreButton');
            const resultCount = document.getElementById('resultCount');

            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1 / -1; text-align:center; color:GrayText;">검색 결과가 없습니다.</p>';
                resultCount.innerText = '총 0개';
                loadMoreButton.hidden = true;
                return;
            }

            const visibleList = list.slice(0, visibleCount);

            visibleList.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = 'video-item';
                item.onclick = () => selectVideo(index);

                const thumbUrl = `https://img.youtube.com/vi/${video.id}/mqdefault.jpg`;

                item.innerHTML = `
                    <div class="thumbnail-wrapper">
                        <img src="${thumbUrl}" alt="thumbnail" loading="lazy">
                    </div>
                    <div class="video-title">${video.title}</div>
                `;
                grid.appendChild(item);
            });

            const shownCount = Math.min(visibleCount, list.length);
            resultCount.innerText = `총 ${list.length}개 중 ${shownCount}개 표시`;
            loadMoreButton.hidden = shownCount >= list.length;
        }

        function getSortedList(list) {
            const sorted = [...list];

            if (sortMode === 'latest') {
                sorted.reverse();
            }

            return sorted;
        }

        function setSortMode(mode) {
            sortMode = mode;
            filterVideos();
        }

        function filterVideos() {
            const query = document.getElementById('searchBar').value.toLowerCase().trim();

            const searched = videoList.filter(video =>
                video.title.toLowerCase().includes(query)
            );

            filteredList = getSortedList(searched);

            visibleCount = PAGE_SIZE;
            renderVideoGrid(filteredList);
            currentTrackIndex = 0;
        }

        function loadMoreVideos() {
            visibleCount += PAGE_SIZE;
            renderVideoGrid(filteredList);
        }

        function selectVideo(index) {
            if (filteredList.length === 0) return;

            currentTrackIndex = index;
            const video = filteredList[currentTrackIndex];

            if (player && video) {
                localStorage.setItem('lastVideoId', video.id);
                document.getElementById('current-playing-title').innerText = video.title;
                player.loadVideoById(video.id);
            }
        }

        // 영상이 끝났을 때(ENDED) 현재 검색된 목록 기준으로 다음 영상 재생
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                playNextVideo();
            }
        }

        function playNextVideo() {
            if (filteredList.length === 0) return;
            currentTrackIndex = (currentTrackIndex + 1) % filteredList.length;
            selectVideo(currentTrackIndex);
        }

        window.onload = function() {
            filteredList = getSortedList(videoList);
            renderVideoGrid(filteredList);
        };
    </script>
