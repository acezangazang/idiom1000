<!DOCTYPE html>
//https://acezangazang.github.io/idiom1000/
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>영어 필수 관용구 1000 개 프로젝트 아카이브</title>
    <style>
        :root {
            color-scheme: light dark;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            margin: 20px;
            background-color: Canvas;
            color: CanvasText;
        }

        h2 {
            margin-top: 0;
        }

.app-layout {
    display: grid;
    grid-template-columns: 600px 1fr;
    gap: 20px;
}

        .player-section {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 16px;
            background: Canvas;
            color: CanvasText;
            padding: 20px;
            border: 1px solid GrayText;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            align-items: stretch;
            max-height: calc(100vh - 80px);
            overflow-y: auto;
        }

        .list-section {
            height: calc(100vh - 80px);
            overflow-y: auto;
            padding-right: 6px;
        }

        #main-player {
            position: relative;
            width: 100%;
            max-width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #000;
        }

        #main-player iframe {
            position: absolute;
            inset: 0;
            width: 100% !important;
            height: 100% !important;
            border: 0;
        }

        .side-panel {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .search-section {
            width: 100%;
        }

        .search-bar {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            font-size: 16px;
            color: FieldText;
            background-color: Field;
            border: 2px solid Highlight;
            border-radius: 20px;
            outline: none;
        }

        .search-bar:focus {
            box-shadow: 0 0 0 3px color-mix(in srgb, Highlight 25%, transparent);
        }

        .sort-buttons {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .sort-buttons button {
            padding: 8px 14px;
            border: 1px solid GrayText;
            border-radius: 20px;
            background: ButtonFace;
            color: ButtonText;
            cursor: pointer;
        }

        .sort-buttons button:hover {
            filter: brightness(0.95);
        }

        .current-info {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        #current-playing-title {
            margin: 0;
            font-size: 18px;
            line-height: 1.4;
        }

        .auto-play-note {
            margin: 0;
            color: CanvasText;
            font-weight: bold;
            opacity: 0.8;
        }

        .next-button {
            align-self: flex-start;
            padding: 8px 15px;
            background: Highlight;
            color: HighlightText;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        .next-button:hover {
            filter: brightness(0.95);
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 15px;
        }

        .video-item {
            background: Canvas;
            color: CanvasText;
            border: 1px solid GrayText;
            border-radius: 6px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .video-item:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .thumbnail-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            background: Canvas;
        }

        .thumbnail-wrapper img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-title {
            padding: 10px;
            font-size: 13px;
            font-weight: bold;
            line-height: 1.4;
            color: CanvasText;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }


        .load-more-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin: 24px 0 10px;
        }

        .result-count {
            font-size: 14px;
            color: CanvasText;
            opacity: 0.75;
        }

        .load-more-button {
            padding: 10px 24px;
            background: Highlight;
            color: HighlightText;
            border: none;
            border-radius: 24px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .load-more-button:hover {
            filter: brightness(0.95);
        }

        .load-more-button[hidden] {
            display: none;
        }

        .mobile-note-section {
            display: none;
        }

        @media (max-width: 980px) {
            .app-layout {
                display: block;
                height: auto;
            }

            .player-section {
                position: sticky;
                top: 0;
                z-index: 100;
                display: grid;
                grid-template-columns: 1fr 1fr 1fr minmax(120px, 1.5fr);
                gap: 8px;
                max-height: none;
                overflow-y: visible;
                margin-bottom: 10px;
            }

            #main-player {
                order: 1;
                grid-column: 1 / -1;
                width: 100%;
                aspect-ratio: 16 / 9;
            }

            #current-playing-title {
                display: none;
            }

            .player-section > .next-button {
                order: 2;
                grid-column: 1;
                width: 100%;
                align-self: stretch;
                padding: 9px 8px;
                font-size: 14px;
                white-space: nowrap;
            }

            .player-section > .sort-buttons {
                order: 3;
                grid-column: 2 / 4;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 8px;
                margin-top: 0;
            }

            .player-section > .sort-buttons button {
                padding: 9px 8px;
                font-size: 14px;
                white-space: nowrap;
            }

            .side-panel {
                order: 4;
                grid-column: 4;
                width: 100%;
                display: block;
            }

            .search-section {
                width: 100%;
            }

            .search-bar {
                padding: 9px 10px;
                font-size: 15px;
                height: 100%;
            }

            .mobile-note-section {
                display: block;
                margin: 0 0 10px 0;
            }

            .auto-play-note {
                font-size: 13px;
                line-height: 1.45;
                font-weight: normal;
                opacity: 0.75;
            }

            .list-section {
                height: calc(100vh - 360px);
                min-height: 300px;
                overflow-y: auto;
            }

            .video-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

        @media (max-width: 600px) {
            body {
                margin: 8px;
            }

            h2 {
                display: none;
            }

            .app-layout {
                display: block;
                height: auto;
            }

            .player-section {
                padding: 8px;
                position: sticky;
                top: 0;
                display: grid;
                grid-template-columns: 0.85fr 0.85fr 0.85fr 1.45fr;
                gap: 6px;
                border-radius: 6px;
            }

            #main-player {
                order: 1;
                grid-column: 1 / -1;
                width: 100%;
                aspect-ratio: 16 / 9;
            }

            #main-player iframe {
                position: absolute;
                inset: 0;
                width: 100% !important;
                height: 100% !important;
            }

            #current-playing-title {
                display: none;
            }

            .player-section > .next-button {
                order: 2;
                grid-column: 1;
                width: 100%;
                padding: 7px 4px;
                font-size: 12px;
                white-space: nowrap;
            }

            .player-section > .sort-buttons {
                order: 3;
                grid-column: 2 / 4;
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 6px;
                margin-top: 0;
            }

            .player-section > .sort-buttons button {
                padding: 7px 4px;
                font-size: 12px;
                white-space: nowrap;
            }

            .side-panel {
                order: 4;
                grid-column: 4;
                width: 100%;
            }

            .search-bar {
                padding: 7px 7px;
                font-size: 12px;
                border-radius: 16px;
                height: 100%;
            }

            .mobile-note-section {
                display: block;
                margin: 0 0 10px 0;
            }

            .auto-play-note {
                font-size: 12px;
                line-height: 1.4;
                font-weight: normal;
                opacity: 0.7;
            }

            .list-section {
                height: calc(100vh - 280px);
                min-height: 300px;
                overflow-y: auto;
            }

            .video-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
            }

            .video-title {
                font-size: 12px;
                padding: 8px;
            }

            .load-more-wrap {
                margin: 16px 0 8px;
            }
        }
    </style>
</head>
<body>

    <h2>영어 필수 관용구 1000 개 프로젝트 아카이브 - 구독자 전용</h2>

    <div class="app-layout">
        <div class="player-section">
        <div id="main-player"></div>

                <h3 id="current-playing-title">재생할 영상을 아래에서 선택하세요</h3>                <button class="next-button" onclick="playNextVideo()">다음 영상 건너뛰기</button>
                <div class="sort-buttons">
                    <button onclick="setSortMode('latest')">최신순</button>
                    <button onclick="setSortMode('oldest')">업로드순</button>
                </div>
        <div class="side-panel">
            <div class="search-section">
                <input
                    type="text"
                    id="searchBar"
                    class="search-bar"
                    placeholder="동영상 제목 검색..."
                    oninput="filterVideos()"
                >


            </div>

        </div>
    </div>
        <div class="list-section">
            <div class="mobile-note-section">
                <div class="current-info">

                <p class="auto-play-note">현재 검색된 목록 순서대로 자동 연속 재생됩니다.</br>
1000 개 될 때까지 때때로 업데이트 될 것입니다.</br>
편하게 원하시는 시간에 공부할 수 있는 Tool이 되면 좋겠습니다.</br>
구독해 주시고 지원해 주시는 분들께 감사드립니다.</br>
</p>

            </div>
            </div>

        <div class="video-grid" id="videoGrid"></div>

        <div class="load-more-wrap">
            <div class="result-count" id="resultCount"></div>
            <button class="load-more-button" id="loadMoreButton" onclick="loadMoreVideos()">더 보기</button>
        </div>
    </div>

    <script>
        const ITEMLIST_URL = 'itemlist.txt';
        const PAGE_SIZE = 100;

        let videoList = [];
        let sortMode = 'latest';
        let filteredList = [];
        let currentTrackIndex = 0;
        let visibleCount = PAGE_SIZE;
        let player;
        let youtubeApiReady = false;

        // API 로드
        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            youtubeApiReady = true;
            initPlayer();
        }

        function initPlayer() {
            if (!youtubeApiReady || filteredList.length === 0 || player) return;

            const lastVideoId = localStorage.getItem('lastVideoId');
            const lastVideo = videoList.find(v => v.id === lastVideoId);
            const defaultVideo = lastVideo || filteredList[0];

            currentTrackIndex = filteredList.findIndex(v => v.id === defaultVideo.id);
            if (currentTrackIndex < 0) currentTrackIndex = 0;

            player = new YT.Player('main-player', {
                height: '360',
                width: '640',
                videoId: defaultVideo.id,
                playerVars: {
                    autoplay: 0,
                    rel: 0,
                    origin: window.location.origin
                },
                events: {
                    onStateChange: onPlayerStateChange,
                    onReady: onPlayerReady
                }
            });
        }

        function onPlayerReady() {
            if (filteredList[currentTrackIndex]) {
                document.getElementById('current-playing-title').innerText =
                    filteredList[currentTrackIndex].title;
            }
        }

        function parseItemList(text) {
            return text
                .split(/\r?\n/)
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .filter(line => !line.startsWith('#'))
                .map(line => {
                    const parts = line.split('|');
                    const id = (parts.shift() || '').trim();
                    const title = parts.join('|').trim();

                    if (!id || !title) return null;

                    return { id, title };
                })
                .filter(Boolean);
        }

        async function loadVideoList() {
            const grid = document.getElementById('videoGrid');
            const resultCount = document.getElementById('resultCount');
            const loadMoreButton = document.getElementById('loadMoreButton');

            try {
                if (grid) {
                    grid.innerHTML = '<p style="grid-column: 1 / -1; text-align:center; color:GrayText;">동영상 목록을 불러오는 중입니다...</p>';
                }
                if (resultCount) resultCount.innerText = '';
                if (loadMoreButton) loadMoreButton.hidden = true;

                const response = await fetch(ITEMLIST_URL + '?v=' + Date.now());

                if (!response.ok) {
                    throw new Error('itemlist.txt 파일을 불러오지 못했습니다.');
                }

                const text = await response.text();
                videoList = parseItemList(text);
                filteredList = getSortedList(videoList);
                visibleCount = PAGE_SIZE;
                currentTrackIndex = 0;

                renderVideoGrid(filteredList);
                initPlayer();
            } catch (error) {
                if (grid) {
                    grid.innerHTML = '<p style="grid-column: 1 / -1; text-align:center; color:GrayText;">itemlist.txt 파일을 찾을 수 없거나 읽을 수 없습니다.</p>';
                }
                if (resultCount) resultCount.innerText = '총 0개';
                if (loadMoreButton) loadMoreButton.hidden = true;
                console.error(error);
            }
        }

        function escapeHtml(text) {
            return String(text)
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function renderVideoGrid(list) {
            const grid = document.getElementById('videoGrid');
            const loadMoreButton = document.getElementById('loadMoreButton');
            const resultCount = document.getElementById('resultCount');

            grid.innerHTML = '';

            if (list.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1 / -1; text-align:center; color:GrayText;">검색 결과가 없습니다.</p>';
                resultCount.innerText = '총 0개';
                loadMoreButton.hidden = true;
                return;
            }

            const visibleList = list.slice(0, visibleCount);

            visibleList.forEach((video, index) => {
                const item = document.createElement('div');
                item.className = 'video-item';
                item.onclick = () => selectVideo(index);

                const thumbUrl = `https://img.youtube.com/vi/${video.id}/mqdefault.jpg`;

                item.innerHTML = `
                    <div class="thumbnail-wrapper">
                        <img src="${thumbUrl}" alt="thumbnail" loading="lazy">
                    </div>
                    <div class="video-title">${escapeHtml(video.title)}</div>
                `;
                grid.appendChild(item);
            });

            const shownCount = Math.min(visibleCount, list.length);
            resultCount.innerText = `총 ${list.length}개 중 ${shownCount}개 표시`;
            loadMoreButton.hidden = shownCount >= list.length;
        }

        function getSortedList(list) {
            const sorted = [...list];

            if (sortMode === 'latest') {
                sorted.reverse();
            }

            return sorted;
        }

        function setSortMode(mode) {
            sortMode = mode;
            filterVideos();
        }

        function filterVideos() {
            const query = document.getElementById('searchBar').value.toLowerCase().trim();

            const searched = videoList.filter(video =>
                video.title.toLowerCase().includes(query)
            );

            filteredList = getSortedList(searched);

            visibleCount = PAGE_SIZE;
            renderVideoGrid(filteredList);
            currentTrackIndex = 0;
        }

        function loadMoreVideos() {
            visibleCount += PAGE_SIZE;
            renderVideoGrid(filteredList);
        }

        function selectVideo(index) {
            if (filteredList.length === 0) return;

            const listSection = document.querySelector('.list-section');
            const listScrollTop = listSection ? listSection.scrollTop : 0;

            currentTrackIndex = index;
            const video = filteredList[currentTrackIndex];

            if (player && video) {
                localStorage.setItem('lastVideoId', video.id);
                document.getElementById('current-playing-title').innerText = video.title;
                player.loadVideoById(video.id);

                if (listSection) {
                    listSection.scrollTop = listScrollTop;
                }
            }
        }

        // 영상이 끝났을 때(ENDED) 현재 검색된 목록 기준으로 다음 영상 재생
        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                playNextVideo();
            }
        }

        function playNextVideo() {
            if (filteredList.length === 0) return;
            currentTrackIndex = (currentTrackIndex + 1) % filteredList.length;
            selectVideo(currentTrackIndex);
        }

        window.onload = function() {
            loadVideoList();
        };
    </script>
</body>
</html>
